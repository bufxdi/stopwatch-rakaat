
<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Stopwatch Rakaat</title>

<link rel="manifest" href="manifest.json">

<style>

#nextPrayerCountdown {
  font-size: 13px;
  font-weight: bold;
  margin-top: 5px;
  margin-bottom: 15px;
}    

#nextPrayerCountdown {
    white-space: pre-line;
}

/* =====================================================
   HARI TANGGAL JAM SAAT INI
   ===================================================== */

#currentDateTime {
    width: 100%;
    text-align: center;
    font-weight: bold;
    line-height: 1.4;
    margin-top: 15px;
}

.record-dialog {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:9999;
  justify-content:center;
  align-items:center;
}

.record-dialog-box {
  width:85%;
  max-width:360px;
  background:white;
  border-radius:16px;
  padding:25px 20px;
  text-align:center;
  box-shadow:0 4px 20px rgba(0,0,0,.25);
}

#recordDialogText {
  font-size:20px;
  font-weight:bold;
  margin-bottom:25px;
}

.record-dialog-buttons {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.record-dialog-buttons button {
  min-height:55px;
  font-size:18px;
  font-weight:bold;
  border-radius:12px;
}

#recordYes {
  background:#4CAF50;
  color:white;
}

#recordNo {
  background:#ddd;
  color:#222;
}    

* {
    box-sizing: border-box;
}

body {

    margin-top: 20px;
    margin-bottom: 20px;
    min-height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

    background: #f2f2f2;

    font-family: Arial, sans-serif;

    color: #222;
}

.container {

    width: 92%;

    max-width: 480px;

    background: white;

    border-radius: 20px;

    padding: 30px 20px;

    text-align: center;

    box-shadow: 0 4px 20px rgba(0,0,0,.12);
}


/* =====================================================
   JADWAL SHOLAT
   ===================================================== */

#prayerSchedule {

    width: 100%;

    min-height: 22px;

    margin-bottom: 10px;
    margin-top: 10px;

    font-weight: bold;

    line-height: 1.4;

    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 0 8px;
}

#prayerSchedule span {

    white-space: nowrap;
}


/* =====================================================
   STOPWATCH
   ===================================================== */

#display {

    font-size: clamp(64px,18vw,100px);

    font-weight: bold;

    line-height: 1;

    margin-bottom: 20px;

    font-variant-numeric: tabular-nums;
}


/* =====================================================
   PROGRESS RAKAAT
   ===================================================== */

.progress-container {

    width: 100%;

    height: 18px;

    background: #ddd;

    border-radius: 0;

    overflow: hidden;

    margin-bottom: 12px;
}

#progressBar {

    width: 0%;

    height: 100%;

    background: #222;

    border-radius: 0;

    transition: none;
}


/* =====================================================
   DESKRIPSI
   ===================================================== */

#description {

    min-height: 80px;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 10px;

    margin-bottom: 25px;

    border-radius: 14px;

    background: #eee;

    font-size: clamp(33px,9vw,90px);

    font-weight: bold;
}


/* =====================================================
   TOTAL PROGRESS
   ===================================================== */

.total-progress-wrapper {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 8px;

    margin-bottom: 25px;
}

.total-time {

    width: 20%;

    font-size: clamp(15px,9vw,15px);

    font-weight: bold;

    line-height: 1;

    white-space: nowrap;

    font-variant-numeric: tabular-nums;
}

.total-time.start-time {

    text-align: left;
}

.total-time.end-time {

    text-align: right;
}

.total-progress-container {

    flex: 1;

    height: 18px;

    background: #ddd;

    border-radius: 0;

    overflow: hidden;
}

#totalProgressBar {

    width: 0%;

    height: 100%;

    background: #222;

    border-radius: 0;

    transition: none;
}


/* =====================================================
   BUTTON START / RESET
   ===================================================== */

.buttons {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 14px;

    margin-bottom: 25px;
}

button {

    min-height: 65px;

    border: none;

    border-radius: 14px;

    font-size: 22px;

    font-weight: bold;

    cursor: pointer;

    touch-action: manipulation;
}

#startPause {

    background: #222;

    color: white;
}

#reset {

    background: #ddd;

    color: #222;
}

button:active {

    transform: scale(.97);
}

#startPause:disabled {

    cursor: not-allowed;
}


/* =====================================================
   PILIH SHOLAT
   ===================================================== */

.prayer-title {

    font-size: 18px;

    font-weight: bold;

    margin-bottom: 10px;
}

.prayer-row-1,
.prayer-row-2 {

    display: grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));

    gap: 6px;
}

.prayer-row-1 {

    margin-bottom: 10px;
}

.prayer-row-2 {

    margin-bottom: 15px;
}

.prayer-row-1 button,
.prayer-row-2 button {

    width: 100%;

    min-width: 0;

    height: 50px;

    min-height: 50px;

    max-height: 50px;

    padding: 4px;

    box-sizing: border-box;

    font-size: 12px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: clip;
}

.prayer-row-1 button {

    background: #222;

    color: #ddd;
}


/* =====================================================
   STATUS BUTTON BARIS 2
   ===================================================== */

.selected-prayer {

    background: #ddd;

    color: #222;
}

.selected-prayer.yellow {

    background: #FFD700;

    color: #222;
}

.selected-prayer.green {

    background: #4CAF50;

    color: white;
}


/* =====================================================
   RESET PILIHAN SHOLAT
   ===================================================== */

.prayer-reset-container {

    margin-top: 5px;
}

#prayerReset {

    width: 100%;

    min-height: 55px;

    background: #eee;

    color: #222;

    font-size: 18px;
}


/* =====================================================
   TABEL REKAMAN SHOLAT
   ===================================================== */

.record-title {

    font-size: 18px;

    font-weight: bold;

    margin-top: 30px;

    margin-bottom: 10px;
}

.record-table-wrapper {

    width: 100%;

    overflow-x: auto;

    margin-top: 10px;
}

.record-table {

    width: 100%;

    border-collapse: collapse;

    table-layout: fixed;

    font-size: 11px;
}

.record-table th,
.record-table td {

    border: 1px solid #999;

    padding: 6px 3px;

    text-align: center;

    vertical-align: middle;

    height: 42px;

    word-wrap: break-word;
}

.record-table th {

    background: #222;

    color: white;

    font-weight: bold;
}

.record-table th:first-child {

    width: 30%;
}

.record-table th:not(:first-child) {

    width: 14%;
}

.record-table td:first-child {

    font-weight: bold;
}

.record-table tbody tr:nth-child(even) {

    background: #f7f7f7;
}


/* =====================================================
   RESPONSIVE TABLE
   ===================================================== */

@media (max-width: 380px) {

    .record-table {

        font-size: 9px;
    }

    .record-table th,
    .record-table td {

        padding: 5px 2px;
    }
}

</style>

</head>



<body>

<script>


/* =====================================================
   POLA SHOLAT
   ===================================================== */

            {

            }

        ],

            },

            },

            {

            },

                seconds: 120,

            },

            {

            },

            {

            {

                seconds: 100,

            },

            {
                seconds: 120,
                text: "I - R - 3"
            },

            {
                seconds: 170,
                text: "I - R - 4"
            },

            {
                seconds: 220,
                text: "I - TASY - 2"
            }

        ],

        duration: 260
    }

};



/* =====================================================
   DOM ELEMENT
   ===================================================== */

const display =
    document.getElementById("display");

const description =
    document.getElementById("description");

const progressBar =
    document.getElementById("progressBar");

const totalProgressBar =
    document.getElementById("totalProgressBar");

const totalStartTime =
    document.getElementById("totalStartTime");

const totalEndTime =
    document.getElementById("totalEndTime");

const startPauseButton =
    document.getElementById("startPause");

const resetButton =
    document.getElementById("reset");

const prayerRow2 =
    document.getElementById("prayerRow2");

const prayerReset =
    document.getElementById("prayerReset");

const prayerSchedule =
    document.getElementById("prayerSchedule");

const recordTableBody =
    document.getElementById("recordTableBody");

const currentDateTime =
    document.getElementById("currentDateTime");



/* =====================================================
   VARIABEL STOPWATCH
   ===================================================== */

let startTime = null;

let prayerStartTime = null;

let prayerEndTime = null;

let elapsed = 0;

let timerInterval = null;

let isRunning = false;

let activePrayer = null;

let activeDuration = Infinity;



/* =====================================================
   VARIABEL JADWAL SHOLAT
   ===================================================== */

let prayerScheduleData = [];

let prayerScheduleLoadedDate = "";



/* =====================================================
   LOCAL STORAGE REKAMAN
   ===================================================== */

const RECORD_STORAGE_KEY =
    "stopwatchRakaatRecords_v1";

let prayerRecords = [];



/* =====================================================
   FORMAT STOPWATCH
   ===================================================== */

function formatTime(totalSeconds) {

    const minutes =
        Math.floor(totalSeconds / 60);

    const seconds =
        totalSeconds % 60;


    return (

        String(minutes).padStart(2, "0")

        +

        ":"

        +

        String(seconds).padStart(2, "0")

    );

}



/* =====================================================
   FORMAT CLOCK
   ===================================================== */

function formatClock(date) {

    if (!date) {

        return "";

    }


    return (

        String(date.getHours()).padStart(2, "0")

        +

        ":"

        +

        String(date.getMinutes()).padStart(2, "0")

        +

        ":"

        +

        String(date.getSeconds()).padStart(2, "0")

    );

}



/* =====================================================
   FORMAT DATE KEY
   ===================================================== */

function formatDateKey(date) {

    const year =
        date.getFullYear();

    const month =
        String(date.getMonth() + 1)
            .padStart(2, "0");

    const day =
        String(date.getDate())
            .padStart(2, "0");


    return `${year}-${month}-${day}`;

}



/* =====================================================
   FORMAT TANGGAL TABEL
   ===================================================== */

function formatTableDate(date) {

    const day =
        String(date.getDate())
            .padStart(2, "0");

    const month =
        String(date.getMonth() + 1)
            .padStart(2, "0");

    const year =
        date.getFullYear();


    return `${day}/${month}/${year}`;

}



/* =====================================================
   NAMA HARI
   ===================================================== */

function getDayName(date) {

    const names = [

        "Minggu",
        "Senin",
        "Selasa",
        "Rabu",
        "Kamis",
        "Jumat",
        "Sabtu"

    ];


    return names[date.getDay()];

}



/* =====================================================
   HARI TANGGAL JAM SAAT INI
   ===================================================== */

function updateCurrentDateTime() {

    const now =
        new Date();

    const day =
        getDayName(now);

    const date =
        formatTableDate(now);

    const time =
        formatClock(now)
            .replaceAll(":", ".");

    currentDateTime.textContent =
        day +
        " - " +
        date +
        " - " +
        time;

}



/* =====================================================
   FONT JADWAL = 20% FONT STOPWATCH
   ===================================================== */

function updatePrayerScheduleFont() {

    const stopwatchFontSize =
        parseFloat(
            getComputedStyle(display).fontSize
        );


    prayerSchedule.style.fontSize =
        (stopwatchFontSize * 0.2) + "px";

    currentDateTime.style.fontSize =
        (stopwatchFontSize * 0.2) + "px";

}



/* =====================================================
   LOAD DATA REKAMAN DARI LOCAL STORAGE
   ===================================================== */

function loadPrayerRecords() {

    try {

        const saved =
            localStorage.getItem(
                RECORD_STORAGE_KEY
            );


        if (saved) {

            const parsed =
                JSON.parse(saved);


            if (Array.isArray(parsed)) {

                prayerRecords =
                    parsed.slice(0, 7);

            }

        }

    }

    catch (error) {

        console.error(
            "Gagal membaca localStorage:",
            error
        );

        prayerRecords = [];

    }


    renderPrayerRecords();

}



/* =====================================================
   SIMPAN DATA REKAMAN KE LOCAL STORAGE
   ===================================================== */

function savePrayerRecords() {

    localStorage.setItem(

        RECORD_STORAGE_KEY,

        JSON.stringify(
            prayerRecords
        )

    );

}



/* =====================================================
   RENDER TABEL REKAMAN
   ===================================================== */

function renderPrayerRecords() {

    recordTableBody.innerHTML =
        "";


    /*
       Selalu buat 7 baris.

       Kalau belum ada data,
       baris sisanya kosong.
    */

    for (
        let i = 0;
        i < 7;
        i++
    ) {

        const row =
            document.createElement("tr");


        const record =
            prayerRecords[i] || null;


        /* =========================
           KOLOM TANGGAL
           ========================= */

        const dateCell =
            document.createElement("td");


        if (record) {

            dateCell.innerHTML =
                record.dateDisplay;

        }

        else {

            dateCell.textContent =
                "";

        }


        row.appendChild(
            dateCell
        );


        /* =========================
           KOLOM SHOLAT
           ========================= */

        const prayerNames = [

            "Subuh",
            "Dhuhur",
            "Ashr",
            "Maghrib",
            "Isya"

        ];


        prayerNames.forEach(
            prayerName => {

                const cell =
                    document.createElement("td");


                if (
                    record &&
                    record.prayers &&
                    record.prayers[prayerName]
                ) {

                    cell.textContent =
                        record.prayers[
                            prayerName
                        ];

                }

                else {

                    cell.textContent =
                        "";

                }


                row.appendChild(
                    cell
                );

            }
        );


        recordTableBody.appendChild(
            row
        );

    }

}



/* =====================================================
   REKAM PELAKSANAAN SHOLAT
   ===================================================== */

function recordPrayerExecution(
    prayerName,
    recordDate
) {

    const dateKey =
        formatDateKey(recordDate);


    const dateDisplay =

        formatTableDate(
            recordDate
        )

        +

        "<br>" +

        getDayName(
            recordDate
        );


    /*
       Cari apakah tanggal tersebut
       sudah ada.
    */

    let existingRecord =
        prayerRecords.find(
            record =>
                record.dateKey === dateKey
        );


    /*
       Kalau tanggal belum ada,
       buat baris baru di PALING ATAS.
    */

    if (!existingRecord) {

        existingRecord = {

            dateKey:
                dateKey,

            dateDisplay:
                dateDisplay,

            prayers: {}

        };


        prayerRecords.unshift(
            existingRecord
        );


        /*
           Maksimal 7 tanggal.
           Data paling bawah dibuang.
        */

        if (
            prayerRecords.length > 7
        ) {

            prayerRecords =
                prayerRecords.slice(
                    0,
                    7
                );

        }

    }


    /*
       Waktu direkam DI SINI.

       recordDate adalah waktu ketika
       user memilih YA.
    */

    existingRecord.prayers[
        prayerName
    ] = formatClock(
        recordDate
    );


    savePrayerRecords();

    renderPrayerRecords();

}



/* =====================================================
   AMBIL JADWAL 1 HARI DARI API
   ===================================================== */

async function fetchPrayerDay(date) {

    const year =
        date.getFullYear();

    const month =
        String(date.getMonth() + 1)
            .padStart(2, "0");

    const day =
        String(date.getDate())
            .padStart(2, "0");


    const url =

        `https://api.myquran.com/v2/sholat/jadwal/1301/${year}/${month}/${day}`;


    const response =
        await fetch(url);


    if (!response.ok) {

        throw new Error(
            "Gagal mengambil data API"
        );

    }


    const result =
        await response.json();


    if (
        !result.data ||
        !result.data.jadwal
    ) {

        throw new Error(
            "Format data API tidak sesuai"
        );

    }


    return result.data.jadwal;

}



/* =====================================================
   BUAT OBJECT WAKTU SHOLAT
   ===================================================== */

function createPrayerEvent(
    date,
    prayerName,
    timeText
) {

    if (!timeText) {

        return null;

    }


    const parts =
        timeText.split(":");


    const hour =
        parseInt(
            parts[0],
            10
        );


    const minute =
        parseInt(
            parts[1],
            10
        );


    const datetime =

        new Date(

            date.getFullYear(),

            date.getMonth(),

            date.getDate(),

            hour,

            minute,

            0,

            0

        );


    return {

        name:
            prayerName,

        time:
            timeText,

        datetime:
            datetime,

        dateKey:
            formatDateKey(date)

    };

}



/* =====================================================
   LOAD JADWAL HARI INI + BESOK
   ===================================================== */

async function loadPrayerSchedule() {

    try {

        prayerSchedule.innerHTML =

        const today =
            new Date();


        const tomorrow =
            new Date(today);


        tomorrow.setDate(
            tomorrow.getDate() + 1
        );


        const [
            todaySchedule,
            tomorrowSchedule
        ] =

            await Promise.all([

                fetchPrayerDay(today),

                fetchPrayerDay(tomorrow)

            ]);


        const newData = [];


        const schedules = [

            {
                date:
                    today,

                data:
                    todaySchedule
            },

            {
                date:
                    tomorrow,

                data:
                    tomorrowSchedule
            }

        ];


        schedules.forEach(
            item => {

                const date =
                    item.date;


                const schedule =
                    item.data;


                const prayers = [

                    {
                        name:
                            "Subuh",

                        time:
                            schedule.subuh
                    },

                    {
                        name:
                            "Dhuhur",

                        time:
                            schedule.dzuhur
                    },

                    {
                        name:
                            "Ashar",

                        time:
                            schedule.ashar
                    },

                    {
                        name:
                            "Maghrib",

                        time:
                            schedule.maghrib
                    },

                    {
                        name:
                            "Isya",

                        time:
                            schedule.isya
                    }

                ];


                prayers.forEach(
                    prayer => {

                        const event =
                            createPrayerEvent(

                                date,

                                prayer.name,

                                prayer.time

                            );


                        if (event) {

                            newData.push(
                                event
                            );

                        }

                    }
                );

            }
        );


        prayerScheduleData =
            newData.sort(

                (a, b) =>
                    a.datetime -
                    b.datetime

            );


        prayerScheduleLoadedDate =
            formatDateKey(
                new Date()
            );


        updatePrayerScheduleDisplay();

    }

    catch (error) {

        console.error(
            "Prayer API error:",
            error
        );


        prayerSchedule.innerHTML =

            "<span>Jadwal sholat tidak tersedia</span>";

    }

}



/* =====================================================
   TAMPILKAN 5 SHOLAT TERDEKAT
   ===================================================== */

function updatePrayerScheduleDisplay() {

    const now =
        new Date();


    const upcoming =

        prayerScheduleData

            .filter(

                prayer =>
                    prayer.datetime >
                    now

            )

            .slice(
                0,
                6
            );


    const nextPrayerCountdown =
        document.getElementById("nextPrayerCountdown");


    if (upcoming.length > 0) {

        const nextPrayer =
            upcoming[0];

        const difference =
            nextPrayer.datetime.getTime() -
            now.getTime();

        const totalSeconds =
            Math.floor(
                difference / 1000
            );

        const hours =
            Math.floor(
                totalSeconds / 3600
            );

        const minutes =
            Math.floor(
                (totalSeconds % 3600) / 60
            );

        const seconds =
            totalSeconds % 60;

        nextPrayerCountdown.textContent =
            "Sholat terdekat dalam waktu \n" +
            hours +
            " jam " +
            minutes +
            " menit " +
            seconds +
            " detik";

    } else {

        nextPrayerCountdown.textContent = "";

    }


    if (
        upcoming.length === 0
    ) {

        prayerSchedule.innerHTML =
            "<span>Memuat jadwal...</span>";

        return;

    }


    prayerSchedule.innerHTML =
        "";


    upcoming.forEach(
        (prayer, index) => {

            const span =
                document.createElement(
                    "span"
                );


            const dayLabel =

                prayer.dateKey ===
                formatDateKey(now)

                    ? ""

                    :

                    getDayName(
                        prayer.datetime
                    ) + " ";


            span.textContent =

                dayLabel +

                prayer.name +

                " " +

                prayer.time;


            prayerSchedule.appendChild(
                span
            );


            if (
                index <
                upcoming.length - 1
            ) {

                const separator =
                    document.createElement(
                        "span"
                    );


                separator.textContent =
                    "|";


                prayerSchedule.appendChild(
                    separator
                );

            }

        }
    );

}



/* =====================================================
   CEK PERGANTIAN HARI
   ===================================================== */

function checkPrayerSchedule() {

    const todayKey =
        formatDateKey(
            new Date()
        );


    if (
        todayKey !==
        prayerScheduleLoadedDate
    ) {

        loadPrayerSchedule();

        return;

    }


    updatePrayerScheduleDisplay();

}



/* =====================================================
   UPDATE DISPLAY STOPWATCH
   ===================================================== */

function updateDisplay() {

    const wholeSeconds =
        Math.floor(elapsed);


    display.textContent =
        formatTime(
            wholeSeconds
        );


    if (!activePrayer) {

        description.textContent =
            "";

        progressBar.style.width =
            "0%";

        return;

    }


    const stages =
        prayerPatterns[
            activePrayer
        ].stages;


    let currentStage =
        stages[0];


    let nextStage =
        null;


    for (
        let i = 0;
        i < stages.length;
        i++
    ) {

        if (
            wholeSeconds >=
            stages[i].seconds
        ) {

            currentStage =
                stages[i];


            nextStage =
                stages[i + 1] ||
                null;

        }

    }


    description.textContent =
        currentStage.text;


    const stageStart =
        currentStage.seconds;


    const stageEnd =
        nextStage

            ? nextStage.seconds

            : activeDuration;


    let stageProgress;


    if (
        stageEnd ===
        stageStart
    ) {

        stageProgress =
            100;

    }

    else {

        stageProgress =

            (

                (

                    wholeSeconds -
                    stageStart

                )

                /

                (

                    stageEnd -
                    stageStart

                )

            )

            * 100;

    }


    stageProgress =

        Math.max(

            0,

            Math.min(
                100,
                stageProgress
            )

        );


    progressBar.style.width =
        stageProgress + "%";


    updateTotalProgress();

}



/* =====================================================
   TOTAL PROGRESS
   ===================================================== */

function updateTotalProgress() {

    if (

        prayerStartTime === null ||

        activeDuration === Infinity

    ) {

        totalProgressBar.style.width =
            "0%";

        return;

    }


    const wholeSeconds =
        Math.floor(elapsed);


    const progress =

        Math.max(

            0,

            Math.min(

                100,

                (

                    wholeSeconds /
                    activeDuration

                )

                * 100

            )

        );


    totalProgressBar.style.width =
        progress + "%";

}



/* =====================================================
   RESET STOPWATCH
   ===================================================== */

function resetStopwatch() {

    clearInterval(
        timerInterval
    );


    timerInterval =
        null;


    isRunning =
        false;


    startTime =
        null;


    prayerStartTime =
        null;


    prayerEndTime =
        null;


    elapsed =
        0;


    display.textContent =
        "00:00";


    progressBar.style.width =
        "0%";


    totalProgressBar.style.width =
        "0%";


    totalStartTime.textContent =
        "";


    totalEndTime.textContent =
        "";


    if (activePrayer) {

        const pattern =
            prayerPatterns[
                activePrayer
            ];


        description.textContent =
            pattern.stages[0].text;

    }

    else {

        description.textContent =
            "";

    }

}



/* =====================================================
   MULAI STOPWATCH
   ===================================================== */

function startStopwatch() {

    if (
        !activePrayer ||
        isRunning
    ) {
        return;
    }


    const pattern =
        prayerPatterns[
            activePrayer
        ];


    activeDuration =
        pattern.duration;


    /*
       Tampilkan pertanyaan
       YA / TIDAK
    */

    const recordDialog =
        document.getElementById("recordDialog");


    const recordDialogText =
        document.getElementById("recordDialogText");


    const recordYes =
        document.getElementById("recordYes");


    const recordNo =
        document.getElementById("recordNo");


    recordDialogText.textContent =
        "Rekam jam pelaksanaan sholat " +
        activePrayer +
        "?";


    recordDialog.style.display = "flex";


    /*
       Fungsi setelah user memilih
       YA atau TIDAK
    */

    function continueStart(shouldRecord) {

        recordDialog.style.display = "none";


        /*
           Waktu diambil SETELAH user
           memilih YA / TIDAK.
        */

        const decisionTime =
            new Date();


        /*
           Jika YA, simpan waktu.
        */

        if (shouldRecord === true) {

            recordPrayerExecution(
                activePrayer,
                decisionTime
            );

        }


        /*
           Baru sekarang stopwatch dimulai.
        */

        prayerStartTime =
            decisionTime;


        prayerEndTime =
            new Date(
                prayerStartTime.getTime()
                +
                activeDuration * 1000
            );


        startTime =
            decisionTime;


        elapsed = 0;


        totalStartTime.textContent =
            formatClock(prayerStartTime);


        totalEndTime.textContent =
            formatClock(prayerEndTime);


        isRunning = true;


        updateDisplay();


        timerInterval =
            setInterval(() => {

                const now =
                    new Date();


                elapsed =
                    (
                        now.getTime() -
                        startTime.getTime()
                    ) / 1000;


                if (
                    elapsed >=
                    activeDuration
                ) {

                    elapsed =
                        activeDuration;


                    updateDisplay();


                    clearInterval(
                        timerInterval
                    );


                    timerInterval = null;


                    isRunning = false;


                    return;

                }


                updateDisplay();

            }, 200);


        /*
           Hapus event listener setelah
           pilihan sudah digunakan.
        */

        recordYes.onclick = null;
        recordNo.onclick = null;

    }


    /*
       Tombol YA
    */

    recordYes.onclick = function() {

        continueStart(true);

    };


    /*
       Tombol TIDAK
    */

    recordNo.onclick = function() {

        continueStart(false);

    };

}



/* =====================================================
   BUTTON MULAI
   ===================================================== */

startPauseButton.addEventListener(

    "click",

    startStopwatch

);



/* =====================================================
   BUTTON RESET
   ===================================================== */

resetButton.addEventListener(

    "click",

    () => {

        resetStopwatch();

    }

);



/* =====================================================
   BUTTON SHOLAT BARIS 1
   ===================================================== */

document
    .querySelectorAll(
        ".prayer-row-1 button"
    )
    .forEach(
        button => {

            button.addEventListener(

                "click",

                () => {

                    const prayer =
                        button.dataset.prayer;


                    let existing =
                        document.querySelector(

                            `.prayer-row-2 button[data-prayer="${prayer}"]`

                        );


                    if (!existing) {

                        existing =
                            document.createElement(
                                "button"
                            );


                        existing.dataset.prayer =
                            prayer;


                        existing.textContent =
                            prayer;


                        existing.className =
                            "selected-prayer";


                        prayerRow2.appendChild(
                            existing
                        );


                        addPrayerButtonLogic(
                            existing
                        );

                    }

                }

            );

        }

    );



/* =====================================================
   LOGIKA BUTTON BARIS 2
   ===================================================== */

function addPrayerButtonLogic(button) {

    button.addEventListener(

        "click",

        () => {


            /*
               GRAY -> YELLOW
            */

            if (

                !button.classList.contains(
                    "yellow"
                )

                &&

                !button.classList.contains(
                    "green"
                )

            ) {

                button.classList.add(
                    "yellow"
                );


                button.classList.remove(
                    "green"
                );


                activePrayer =
                    button.dataset.prayer;


                activeDuration =

                    prayerPatterns[
                        activePrayer
                    ].duration;


                resetStopwatch();


                description.textContent =

                    prayerPatterns[
                        activePrayer
                    ].stages[0].text;


                startPauseButton.disabled =
                    false;


                return;

            }


            /*
               YELLOW -> GREEN
            */

            if (
                button.classList.contains(
                    "yellow"
                )
            ) {

                button.classList.remove(
                    "yellow"
                );


                button.classList.add(
                    "green"
                );


                return;

            }


            /*
               GREEN -> GRAY
            */

            if (
                button.classList.contains(
                    "green"
                )
            ) {

                button.classList.remove(
                    "green"
                );


                activePrayer =
                    null;


                activeDuration =
                    Infinity;


                resetStopwatch();


                startPauseButton.disabled =
                    true;

            }

        }

    );

}



/* =====================================================
   RESET PILIHAN SHOLAT
   ===================================================== */

prayerReset.addEventListener(

    "click",

    () => {

        prayerRow2.innerHTML =
            "";


        activePrayer =
            null;


        activeDuration =
            Infinity;


        startPauseButton.disabled =
            true;


        resetStopwatch();

    }

);



/* =====================================================
   RESPONSIVE FONT JADWAL
   ===================================================== */

window.addEventListener(

    "resize",

    updatePrayerScheduleFont

);



/* =====================================================
   INITIALIZATION
   ===================================================== */

updatePrayerScheduleFont();

updateCurrentDateTime();

loadPrayerRecords();

loadPrayerSchedule();


/*
   Update hari, tanggal, dan jam
   setiap 1 detik.
*/

setInterval(

    updateCurrentDateTime,

    1000

);


/*
   Cek jadwal setiap 1 detik.

   API tidak dipanggil setiap detik.

   API hanya dipanggil kembali
   ketika tanggal berganti.
*/

setInterval(

    checkPrayerSchedule,

    1000

);
